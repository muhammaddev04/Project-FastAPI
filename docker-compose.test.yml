# Disposable PostgreSQL and Redis for backend tests (TZ 01_GLOBAL §14: tests run on real PostgreSQL).
# Usage: docker compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: tezfarmo-postgres-test
    environment:
      POSTGRES_DB: tezfarmo_test
      POSTGRES_USER: tezfarmo
      POSTGRES_PASSWORD: tezfarmo
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tezfarmo -d tezfarmo_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    container_name: tezfarmo-redis-test
    ports:
      - "6381:6379"
