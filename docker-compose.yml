# Local development services. Start with: docker compose up -d
# Ports avoid the common 5432/6379 defaults, which are often taken on developer machines.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tezfarmo-postgres
    environment:
      POSTGRES_DB: tezfarmo
      POSTGRES_USER: tezfarmo
      POSTGRES_PASSWORD: tezfarmo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tezfarmo -d tezfarmo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tezfarmo-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
