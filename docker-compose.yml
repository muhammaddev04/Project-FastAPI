# Local development services. Start with: docker compose up -d
# Ports avoid the common 5432/6379 defaults, which are often taken on developer machines.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tezfarmo-postgres
    environment:
      POSTGRES_DB: tezfarmo
      POSTGRES_USER: tezfarmo
      POSTGRES_PASSWORD: tezfarmo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tezfarmo -d tezfarmo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tezfarmo-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible private file storage (SeaweedFS; any S3 provider works in production). Dev-only credentials.
  storage:
    image: chrislusf/seaweedfs:latest
    container_name: tezfarmo-storage
    # One node grows 7 volumes per new bucket; small volumes and a higher cap keep that possible locally.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0 -volume.max=100 -master.volumeSizeLimitMB=64
    ports:
      - "9000:8333"
    volumes:
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - storage_data:/data

volumes:
  postgres_data:
  storage_data:
