[project]
name = "tezfarmo-backend"
version = "0.1.0"
description = "TezFarmo API (FastAPI) - P00 foundation and P01 identity & access"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.34",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "redis>=5.0.8",
  "argon2-cffi>=23.1.0",
  "PyJWT[crypto]>=2.9.0",
  "uuid-utils>=0.9.0",
  "email-validator>=2.2.0",
  "httpx>=0.27.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.2", "pytest-asyncio>=0.24.0", "pytest-cov>=5.0.0", "ruff>=0.6.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
